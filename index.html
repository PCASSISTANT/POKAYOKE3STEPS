<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KTMEX | Poka-Yoke System</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<style>
    :root {
        --bg-main: #1a1b21;
        --bg-panel: #25262c;
        --border-dashed: #4a4b50;
        --red-step: #ff0b21;
        --blue-btn: #007bff;
        --text-main: #ffffff;
        --text-muted: #8b949e;
        --bg-pill: #2a2b32;
        --green-ok: #10b981;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* VISTA DE LOGIN */
    .login-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 20px;
        flex: 1;
    }
    .input-box {
        width: 100%;
        background-color: var(--bg-pill);
        border: 1px solid var(--border-dashed);
        border-radius: 8px;
        padding: 14px;
        color: var(--text-main);
        font-size: 16px;
        font-weight: 700;
        outline: none;
        margin-bottom: 15px;
        text-align: center;
    }
    .input-box:focus {
        border-color: var(--blue-btn);
    }

    /* HEADER Y CHIP DE USUARIO */
    .scan-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px 5px 20px;
    }
    .step-title {
        color: var(--green-ok);
        font-size: 20px;
        font-weight: 900;
        text-transform: uppercase;
        margin: 0;
        letter-spacing: 0.5px;
    }
    .user-pill {
        background-color: var(--bg-pill);
        color: var(--text-muted);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
    }

    /* BARRITAS DE PROGRESO (MODIFICADAS A VERDE) */
    .progress-container {
        display: flex;
        gap: 8px;
        padding: 0 20px;
        margin-top: 10px;
        margin-bottom: 25px;
    }
    .progress-bar {
        flex: 1;
        height: 6px;
        background-color: #3f4048;
        border-radius: 4px;
        transition: all 0.3s ease;
    }
    .progress-bar.active {
        background-color: var(--green-ok);
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }

    /* CAJA PRINCIPAL DE ESCANEO */
    .workspace {
        flex: 1;
        padding: 0 20px;
        display: flex;
        flex-direction: column;
    }
    .scan-box-dashed {
        background-color: var(--bg-panel);
        border: 2px dashed var(--border-dashed);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 160px;
        margin-bottom: 25px;
        padding: 20px;
        text-align: center;
        position: relative;
    }
    .scan-prompt-text {
        font-size: 24px;
        font-weight: 800;
        color: var(--text-main);
        text-transform: uppercase;
        margin: 0;
    }
    .scan-sub-text {
        font-size: 14px;
        color: var(--text-muted);
        margin-top: 8px;
        font-weight: 600;
        word-break: break-all;
    }

    /* BOTONES Y ETIQUETAS */
    .btn-blue-large {
        background-color: var(--blue-btn);
        color: white;
        border: none;
        padding: 16px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 800;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        cursor: pointer;
        margin-bottom: 20px;
    }
    .btn-blue-large:active {
        background-color: #0062cc;
    }
    .btn-green { background-color: var(--green-ok); }

    /* NUEVO DISEÑO PARA INDICADOR DE BOTÓN FÍSICO (YA NO ES BOTÓN) */
    .scanner-indicator {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--green-ok);
        background: rgba(16, 185, 129, 0.1);
        border: 1px dashed var(--green-ok);
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 20px;
        text-align: center;
    }

    /* INTENTOS */
    .intentos-text {
        text-align: center;
        color: var(--text-muted);
        font-size: 14px;
        font-weight: 700;
    }

    /* ELEMENTOS DEL PASO 3 Y 4 */
    #ocr-viewport {
        display: none;
        width: 100%;
        height: 180px;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
    }
    #webcam {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .ocr-reticle {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 70%; height: 60px;
        border: 2px solid var(--blue-btn);
        border-radius: 6px;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
    }
    .ocr-raw-live {
        position: absolute;
        top: 6px; left: 6px;
        background: rgba(17, 18, 21, 0.85);
        color: #f59e0b;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-family: monospace;
        font-weight: 700;
        z-index: 10;
        transition: all 0.2s ease;
    }
    .ocr-detected {
        background: rgba(16, 185, 129, 0.95);
        color: white;
    }
    
    .img-verify {
        width: 100%;
        height: 140px;
        object-fit: contain;
        border-radius: 6px;
        margin-bottom: 10px;
        background: var(--bg-pill);
    }
    .tekin-options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        width: 100%;
    }
    .option-btn {
        background: var(--bg-pill);
        border: 1.5px solid var(--blue-btn);
        color: var(--text-main);
        padding: 14px 8px;
        border-radius: 6px;
        font-weight: 800;
        cursor: pointer;
    }

    /* POPUPS Y BLOQUEO */
    #msg-pop {
        position: absolute;
        top: -40px;
        background: rgba(255, 11, 33, 0.2);
        border: 1px solid var(--red-step);
        color: #ff6b7b;
        padding: 8px 12px;
        border-radius: 6px;
        font-weight: 700;
        font-size: 12px;
        display: none;
        z-index: 50;
    }
    .lock-ui {
        position: fixed;
        inset: 0;
        background: #140808;
        border: 4px solid var(--red-step);
        z-index: 9999;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
</style>
</head>
<body>

<!-- VISTA 1: LOGIN -->
<div id="ui-login" class="login-container">
    <h2 style="text-align:center; color:var(--green-ok); margin-bottom: 30px;">KTMEX POKA-YOKE</h2>
    <input type="text" id="nom-input" class="input-box" placeholder="ESCRIBIR O ESCANEAR NÓMINA" autocomplete="off">
    <div id="pin-box" style="display:none;">
        <input type="password" id="pin-input" class="input-box" placeholder="PIN DE LÍDER" autocomplete="off">
    </div>
    <div id="login-msg" style="color:var(--red-step); font-size:12px; font-weight:700; text-align:center; min-height:20px; margin-bottom:10px;"></div>
    <button id="btn-login" type="button" class="btn-blue-large">INGRESAR</button>
</div>

<!-- VISTA 2: FLUJO DE ESCANEO -->
<div id="ui-scan" style="display:none; flex-direction:column; height:100%;">
    
    <!-- HEADER -->
    <div class="scan-header">
        <h1 id="header-step-title" class="step-title">PASO 1: JAMAITA</h1>
        <div id="user-display" class="user-pill">Operador</div>
    </div>

    <!-- BARRITAS -->
    <div class="progress-container">
        <div class="progress-bar active" id="bar-1"></div>
        <div class="progress-bar" id="bar-2"></div>
        <div class="progress-bar" id="bar-3"></div>
        <div class="progress-bar" id="bar-4"></div>
    </div>

    <div class="workspace">
        
        <!-- RECEPTOR OCULTO ZEBRA -->
        <input type="text" id="zebra-wedge-input" inputmode="none" autocomplete="off" style="position:fixed; top:-100px; left:-100px; opacity:0;">

        <!-- ÁREA CENTRAL DE ESCANEO -->
        <div class="scan-box-dashed" id="scan-container">
            <div id="msg-pop">ERROR DE LECTURA</div>
            
            <!-- Texto para pasos -->
            <h2 id="main-prompt" class="scan-prompt-text">ESPERANDO ESCANEO...</h2>
            <div id="sub-prompt" class="scan-sub-text"></div>

            <!-- Cámara para paso 3 -->
            <div id="ocr-viewport">
                <div id="ocr-live-read" class="ocr-raw-live">BUSCANDO KANBAN DE CLIENTE...</div>
                <video id="webcam" autoplay playsinline webkit-playsinline muted></video>
                <div class="ocr-reticle"></div>
            </div>

            <!-- Interfaz Tekin para paso 4 -->
            <div id="step4-container" style="display:none; width:100%; flex-direction:column; align-items:center;">
                <img id="img-tekin" class="img-verify" alt="Referencia Tekin">
                <div id="options-area" class="tekin-options"></div>
            </div>
        </div>

        <!-- CONTROLES INFERIORES: INDICADOR DE ESCÁNER FÍSICO REDISEÑADO -->
        <div id="btn-manual-trigger" class="scanner-indicator">
            <span>📡</span> ESPERANDO ESCÁNER FÍSICO
        </div>
        
        <button id="btn-res" class="btn-blue-large btn-green" style="display:none;">CONTINUAR AL SIGUIENTE PASO</button>
        <button id="btn-finish" class="btn-blue-large btn-green" style="display:none;">FINALIZAR PIEZA</button>

        <div id="retry-counter" class="intentos-text">Intentos: 0/5</div>
    </div>
</div>

<!-- BLOQUEO DE SEGURIDAD -->
<div id="lock" class="lock-ui">
    <h2 style="color:var(--red-step); font-weight:900;">BLOQUEO DE SEGURIDAD</h2>
    <p id="lock-msg" style="color:white; font-weight:700; margin-bottom: 20px;">EXCESO DE INTENTOS</p>
    <input type="password" id="pin-tl" class="input-box" style="max-width:280px;" placeholder="PIN DE LÍDER">
    <button id="btn-unlock" type="button" class="btn-blue-large" style="background-color:var(--red-step); max-width:280px;">DESBLOQUEAR</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { initializeFirestore, doc, getDoc, setDoc, collection, addDoc, serverTimestamp, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA6Il03GHS4L_eDY1Kv3fMyF2EwuYLQ5qY",
        authDomain: "logistica-ktmex.firebaseapp.com",
        databaseURL: "https://logistica-ktmex-default-rtdb.firebaseio.com",
        projectId: "logistica-ktmex",
        storageBucket: "logistica-ktmex.firebasestorage.app",
        messagingSenderId: "166597623735",
        appId: "1:166597623735:web:3eace2ff8efec0f081b232",
        measurementId: "G-4YYT138NFR"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1GkWY2r-kz_wfv_-LPEeFEdKe1qNILTV86pln2xg_rIM/gviz/tq?tqx=out:csv";
    
    const BASE_M_CODES = new Set([
        "M452","M300","M976","M776","M270","M561","M012","M387","M250","M971",
        "M051","M124","M279","M981","M342","M463","M556","M645","M788","M837",
        "M047","M942","M163","M783","M258","M677","M339","M534","M440","M069",
        "M926","M153","M885","M201","M755","M362","M690","M411","M590","M991",
        "M093","M849","M105","M790","M204","M682","M369","M585","M472","M043",
        "M895","M140","M456","M626","M888","M375","M504","M096","M674","M948",
        "M549","M172","M474","M719","M145","M484","M016","M382","M021","M808",
        "M246","M744","M351","M563","M101","M831","M076","M997","M057","M530",
        "M229","M641","M912","M226","M492","M128","M672","M813","M372","M699",
        "M168","M568","M213","M726","M039","M183","M575","M239","M967","M748",
        "M112","M865"
    ]);

    let sheetData = [], usersCache = {}, ocrTrainingMap = {};
    let learnedThresholds = [125, 105, 145];
    let thresholdIdx = 0;
    
    let user = null, step = 1, jamaita = "", kanbanParte = "", idCliente = "", expectedIdCliente = "", pendingData = null, retryCount = 0, paused = false;
    let ocrWorker = null, ocrTimer = null, isOcrBusy = false, videoStream = null;
    let lastRawOcrToken = "";

    const roiCanvas = document.createElement('canvas');
    roiCanvas.width = 260; roiCanvas.height = 80;
    const roiCtx = roiCanvas.getContext('2d', { willReadFrequently: true });

    // 1. INICIALIZACIÓN
    async function initBackgroundResources() {
        try {
            const localSheet = localStorage.getItem('ktmex_sheet');
            if (localSheet) sheetData = JSON.parse(localSheet);
            const localOcr = localStorage.getItem('ktmex_ocr_map');
            if (localOcr) ocrTrainingMap = JSON.parse(localOcr);
        } catch (e) {}

        fetch(SHEET_CSV_URL).then(res => res.text()).then(data => { 
            sheetData = parseCSV(data);
            try { localStorage.setItem('ktmex_sheet', JSON.stringify(sheetData)); } catch (e) {}
        });

        try {
            if (window.Tesseract) {
                ocrWorker = await Tesseract.createWorker();
                await ocrWorker.loadLanguage('eng');
                await ocrWorker.initialize('eng');
                await ocrWorker.setParameters({
                    tessedit_char_whitelist: 'M0123456789OISBZGHAENWQDTL',
                    tessedit_pageseg_mode: '7'
                });
            }
        } catch(e) { console.warn("Tesseract no cargó, se usará Tesseract.recognize directo"); }
    }

    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        return lines.map(line => {
            const result = [];
            let cell = '', inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') { inQuotes = !inQuotes; } 
                else if (char === ',' && !inQuotes) { result.push(cell.trim().replace(/^"|"$/g, '')); cell = ''; } 
                else { cell += char; }
            }
            result.push(cell.trim().replace(/^"|"$/g, ''));
            return result;
        });
    }

    // 2. LOGIN
    async function checkLogin() {
        const nomInput = document.getElementById('nom-input');
        const pinInput = document.getElementById('pin-input');
        const msgEl = document.getElementById('login-msg');
        const btnLogin = document.getElementById('btn-login');

        const nom = nomInput.value.trim();
        const pin = pinInput.value.trim();
        msgEl.innerText = "";

        if (!nom) {
            msgEl.innerText = "Ingrese o escanee un número de nómina.";
            nomInput.focus();
            return;
        }
        
        btnLogin.disabled = true;
        btnLogin.innerText = "VALIDANDO...";

        try {
            const s = await getDoc(doc(db, "Usuarios", nom));
            if (s.exists()) {
                const u = s.data();
                const nivelNorm = String(u.nivel || "").trim().toLowerCase();
                
                if (nivelNorm === "operador") {
                    startSession(u);
                } else {
                    const pinBox = document.getElementById('pin-box');
                    if (pinBox.style.display === 'none') {
                        pinBox.style.display = 'block';
                        msgEl.innerText = "Usuario Líder: Ingrese su PIN y presione INGRESAR.";
                        pinInput.focus();
                    } else if (String(pin).trim() === String(u.pin || "").trim() && pin !== "") {
                        startSession(u);
                    } else {
                        msgEl.innerText = "PIN de Líder incorrecto.";
                        pinInput.focus();
                    }
                }
            } else {
                msgEl.innerText = `La nómina "${nom}" no existe en la base.`;
            }
        } catch(e) { msgEl.innerText = "Error de red al validar usuario."; }
        
        btnLogin.disabled = false;
        btnLogin.innerText = "INGRESAR";
    }

    function startSession(u) {
        user = u;
        document.getElementById('user-display').innerText = u.nombre || "Operador";
        document.getElementById('ui-login').style.display = 'none';
        document.getElementById('ui-scan').style.display = 'flex';
        updateUIForStep();
    }

    // 3. UI Y FLUJO
    function updateUIForStep() {
        for(let i=1; i<=4; i++) {
            const bar = document.getElementById(`bar-${i}`);
            if(i <= step) bar.classList.add('active');
            else bar.classList.remove('active');
        }

        const title = document.getElementById('header-step-title');
        const mainPrompt = document.getElementById('main-prompt');
        const subPrompt = document.getElementById('sub-prompt');
        const ocrView = document.getElementById('ocr-viewport');
        const step4View = document.getElementById('step4-container');
        const ocrLiveRead = document.getElementById('ocr-live-read');
        
        ocrView.style.display = 'none';
        step4View.style.display = 'none';
        mainPrompt.style.display = 'block';
        subPrompt.style.display = 'block';
        document.getElementById('btn-manual-trigger').style.display = 'flex';
        document.getElementById('btn-res').style.display = 'none';
        document.getElementById('btn-finish').style.display = 'none';
        paused = false;

        // Reset visual de OCR
        ocrLiveRead.innerText = "BUSCANDO KANBAN DE CLIENTE...";
        ocrLiveRead.classList.remove('ocr-detected');

        if(step === 1) {
            title.innerText = "PASO 1: JAMAITA";
            mainPrompt.innerText = "ESPERANDO ESCANEO...";
            subPrompt.innerText = "Escanea la etiqueta Jamaita/Sebango";
            focusHardwareScanner();
        } else if(step === 2) {
            title.innerText = "PASO 2: KANBAN";
            mainPrompt.innerText = "ESPERANDO KANBAN...";
            subPrompt.innerText = `JAMAITA ACTUAL: ${jamaita}`;
            focusHardwareScanner();
        } else if(step === 3) {
            title.innerText = "PASO 3: ID CLIENTE";
            mainPrompt.style.display = 'none';
            subPrompt.style.display = 'none';
            document.getElementById('btn-manual-trigger').style.display = 'none';
            startCameraOCR();
        } else if(step === 4) {
            title.innerText = "PASO 4: TEKIN";
            mainPrompt.style.display = 'none';
            subPrompt.style.display = 'none';
            document.getElementById('btn-manual-trigger').style.display = 'none';
            initStep4();
        }
    }

    function focusHardwareScanner() { document.getElementById('zebra-wedge-input').focus(); }
    
    // Captura del Wedge (Zebra) restaurada con TAB y ENTER
    const wedgeInput = document.getElementById('zebra-wedge-input');
    wedgeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.keyCode === 13 || e.keyCode === 9) {
            e.preventDefault();
            const val = wedgeInput.value.trim();
            wedgeInput.value = "";
            if (val && !paused && (step === 1 || step === 2)) {
                processFound(val);
            }
        }
    });

    // Captura Global para ráfagas (Restaurada exactamente como el 2do código)
    let keyBuffer = "", keyTimer = null;
    window.addEventListener('keydown', (e) => {
        const activeId = document.activeElement ? document.activeElement.id : "";

        if (!user) {
            if ((e.key === 'Enter' || e.keyCode === 13) && (activeId === 'nom-input' || activeId === 'pin-input')) {
                e.preventDefault();
                checkLogin();
            }
            return;
        }

        if (activeId === 'pin-tl') {
            if (e.key === 'Enter' || e.keyCode === 13) document.getElementById('btn-unlock').click();
            return;
        }

        // Permitir avanzar con botón físico (gatillo Zebra) si el paso fue validado
        if (paused && (e.key === 'Enter' || e.keyCode === 13) && document.getElementById('btn-res').style.display === 'block') {
            e.preventDefault();
            document.getElementById('btn-res').click();
            return;
        }

        if (paused || (step !== 1 && step !== 2) || activeId === 'zebra-wedge-input') return;

        if (e.key === 'Enter' || e.keyCode === 13) {
            if (keyBuffer.trim().length > 0) {
                const scanned = keyBuffer.trim();
                keyBuffer = "";
                processFound(scanned);
            }
        } else if (e.key.length === 1) {
            keyBuffer += e.key;
            clearTimeout(keyTimer);
            keyTimer = setTimeout(() => { keyBuffer = ""; }, 400);
        }
    });

    document.addEventListener('click', (e) => {
        if (user && (step === 1 || step === 2) && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
            focusHardwareScanner();
        }
    });

    // 4. LÓGICA CORE DE VALIDACIÓN
    async function processFound(val) {
        paused = true;
        const rawVal = val.trim();

        // PASO 1: JAMAITA
        if (step === 1) {
            jamaita = rawVal;
            const matchH = sheetData.some(row => row[7] && row[7].trim() === jamaita);
            
            if (matchH) {
                document.getElementById('main-prompt').innerText = `¡JAMAITA OK!`;
                document.getElementById('sub-prompt').innerText = jamaita;
                document.getElementById('btn-manual-trigger').style.display = 'none';
                document.getElementById('btn-res').style.display = 'block';
                logToDB("OK", "Paso 1: Jamaita QR Detectada");
            } else {
                handleStepFailure("SEBANGO NO ENCONTRADO EN BD", "Sebango no registrado. Reintentando...");
            }
        } 
        // PASO 2: KANBAN
        else if (step === 2) {
            const parts = rawVal.split('-');
            let parsedPart = rawVal;

            if (parts.length >= 4) {
                parsedPart = parts.slice(1, -1).join('-');
            } else if (parts.length === 3) {
                parsedPart = parts[1];
            } else if (rawVal.includes('-')) {
                parsedPart = rawVal.substring(rawVal.indexOf('-') + 1).trim();
            }

            kanbanParte = parsedPart;

            const matchedRow = sheetData.find(row => {
                const cellH = row[7] ? row[7].trim() : '';
                const cellJ = row[9] ? row[9].trim() : '';
                return cellH === jamaita && cellJ === kanbanParte;
            });
            
            if (matchedRow) {
                expectedIdCliente = matchedRow[8] ? matchedRow[8].trim().toUpperCase() : '';
                document.getElementById('main-prompt').innerText = `¡KANBAN OK!`;
                document.getElementById('sub-prompt').innerText = kanbanParte;
                document.getElementById('btn-manual-trigger').style.display = 'none';
                document.getElementById('btn-res').style.display = 'block';
                logToDB("OK", "Paso 2: Kanban Parte OK");
            } else {
                handleStepFailure("MEZCLA DE PARTE / SEBANGO", "Número de Parte no coincide con Sebango. Reintentando...");
            }
        }
        // PASO 3: ID CLIENTE
        else if (step === 3) {
            idCliente = rawVal.toUpperCase();
            const validRow = sheetData.find(row => {
                const cellH = row[7] ? row[7].trim() : '';
                const cellI = row[8] ? row[8].trim().toUpperCase() : '';
                const cellJ = row[9] ? row[9].trim() : '';
                return cellH === jamaita && cellJ === kanbanParte && cellI === idCliente;
            });

            if (validRow) {
                // Pausar unos instantes para que se vea el freeze de pantalla verde
                setTimeout(() => {
                    stopCameraOCR();
                    getDoc(doc(db, "Maestro_Partes", idCliente))
                        .then(s => { pendingData = s.exists() ? s.data() : {}; })
                        .catch(() => { pendingData = {}; });
                    
                    document.getElementById('main-prompt').style.display = 'block';
                    document.getElementById('sub-prompt').style.display = 'block';
                    document.getElementById('main-prompt').innerText = `¡CLIENTE OK!`;
                    document.getElementById('sub-prompt').innerText = idCliente;
                    document.getElementById('btn-res').style.display = 'block';
                    
                    logToDB("OK", "Paso 3: ID Cliente OK");
                }, 800); // 800ms de visualización antes de ocultar la cámara
            } else {
                handleStepFailure("ID CLIENTE INCORRECTO", "ID Cliente no coincide con Registro. Reintentando...");
            }
        }
    }

    document.getElementById('btn-res').addEventListener('click', () => {
        step++;
        updateUIForStep();
    });

    function logToDB(status, msg = "") {
        addDoc(collection(db, "Bitacora_Incidencias"), {
            usuario: user ? user.nombre : "N/A",
            status, customer_id: jamaita || "N/A", error_msg: msg, timestamp: serverTimestamp()
        }).catch(() => {});
    }

    // 5. CÁMARA Y AUTO-ENTRENAMIENTO OCR (RESTAURADO Y PAUSABLE)
    async function startCameraOCR() {
        document.getElementById('ocr-viewport').style.display = 'block';
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            const videoElem = document.getElementById('webcam');
            videoElem.srcObject = videoStream;
            await videoElem.play();
            ocrTimer = setInterval(runUltraLightOCR, 300);
        } catch(e) { 
            const pop = document.getElementById('msg-pop');
            pop.innerText = "Error accediendo a la cámara.";
            pop.style.display = 'block';
        }
    }

    function stopCameraOCR() {
        if (ocrTimer) { clearInterval(ocrTimer); ocrTimer = null; }
        if(videoStream) { videoStream.getTracks().forEach(t => t.stop()); }
        document.getElementById('ocr-viewport').style.display = 'none';
    }

    function normalizeOcrCandidate(rawToken) {
        const clean = rawToken.replace(/[^A-Z0-9]/g, '').toUpperCase();
        if (clean.length < 4) return null;
        if (ocrTrainingMap[clean]) return ocrTrainingMap[clean];

        const sub = clean.substring(0, 4);
        if (!['M', 'N', 'H', 'W'].includes(sub[0])) return null;

        const digitMap = { 'O': '0', 'Q': '0', 'D': '0', 'I': '1', 'L': '1', 'Z': '2', 'E': '3', 'A': '4', 'S': '5', 'G': '6', 'T': '7', 'B': '8' };
        let digits = "";
        for (let i = 1; i < sub.length; i++) {
            digits += (digitMap[sub[i]] !== undefined) ? digitMap[sub[i]] : sub[i];
        }
        const candidate = 'M' + digits;
        return /^M\d{3}$/.test(candidate) ? candidate : null;
    }

    function saveOcrLearningToFirebase(rawStr, validTargetCode, usedThreshold) {
        const cleanRaw = rawStr.replace(/[^A-Z0-9]/g, '').toUpperCase();
        if (!cleanRaw || cleanRaw === validTargetCode) return;
        if (ocrTrainingMap[cleanRaw] === validTargetCode) return;

        ocrTrainingMap[cleanRaw] = validTargetCode;
        try { localStorage.setItem('ktmex_ocr_map', JSON.stringify(ocrTrainingMap)); } catch (e) {}

        setDoc(doc(db, "OCR_Aprendizaje", cleanRaw), {
            raw: cleanRaw, target: validTargetCode, threshold: usedThreshold,
            usuario: user ? user.nombre : "Operador", timestamp: serverTimestamp()
        }).catch(() => {});
    }

    async function runUltraLightOCR() {
        if (paused || step !== 3 || isOcrBusy) return;
        const videoElem = document.getElementById('webcam');
        if (!videoElem.videoWidth) return;

        isOcrBusy = true;
        try {
            const vw = videoElem.videoWidth, vh = videoElem.videoHeight;
            const cropW = vw * 0.60, cropH = vh * 0.28;
            const cropX = (vw - cropW) / 2, cropY = (vh - cropH) / 2;

            roiCtx.drawImage(videoElem, cropX, cropY, cropW, cropH, 0, 0, roiCanvas.width, roiCanvas.height);
            const imgData = roiCtx.getImageData(0, 0, roiCanvas.width, roiCanvas.height);
            const data = imgData.data;
            const currentThreshold = learnedThresholds[thresholdIdx];
            thresholdIdx = (thresholdIdx + 1) % learnedThresholds.length;

            for (let i = 0; i < data.length; i += 4) {
                const lum = (data[i] + data[i + 1] + data[i + 2]) / 3;
                const bin = lum < currentThreshold ? 0 : 255;
                data[i] = data[i + 1] = data[i + 2] = bin;
            }
            roiCtx.putImageData(imgData, 0, 0);

            let recognizedText = "";
            if (ocrWorker) {
                const res = await ocrWorker.recognize(roiCanvas);
                recognizedText = res.data.text;
            }

            const tokens = recognizedText.toUpperCase().split(/[\s\n]+/);
            for (let w of tokens) {
                const cleaned = w.replace(/[^A-Z0-9]/g, '');
                const candidate = normalizeOcrCandidate(cleaned);
                
                // Si la BD contiene el candidato, validamos y PAUSAMOS visualmente
                if (candidate && BASE_M_CODES.has(candidate)) {
                    if (cleaned !== candidate && candidate === expectedIdCliente) {
                        saveOcrLearningToFirebase(cleaned, candidate, currentThreshold);
                    }
                    if (!paused) { 
                        // Congelar visualmente la lectura
                        videoElem.pause(); 
                        const ocrLiveRead = document.getElementById('ocr-live-read');
                        ocrLiveRead.innerText = `DETECTADO: ${candidate}`;
                        ocrLiveRead.classList.add('ocr-detected');
                        
                        processFound(candidate); 
                        break; 
                    }
                }
            }
        } catch (e) {} finally { isOcrBusy = false; }
    }

    // 6. PASO 4 TEKIN
    function initStep4() {
        document.getElementById('step4-container').style.display = 'flex';
        const img = document.getElementById('img-tekin');
        if (pendingData && pendingData.img_url) {
            img.src = pendingData.img_url;
            img.style.display = 'block';
        } else {
            img.style.display = 'none';
        }

        const t_ok = (pendingData && pendingData.Tekin_OK) || "Correcto";
        const t_ng = (pendingData && pendingData.Tekin_NG) || "Incorrecto";
        const opts = [t_ok, t_ng].sort(() => Math.random() - 0.5);

        const area = document.getElementById('options-area');
        area.innerHTML = "";
        
        opts.forEach(o => {
            const b = document.createElement('button');
            b.className = "option-btn";
            b.innerText = o;
            b.onclick = () => {
                if(o === t_ok) {
                    area.innerHTML = "<h3 style='color:#10b981; grid-column:span 2; text-align:center;'>VALIDADO CORRECTAMENTE</h3>";
                    document.getElementById('btn-finish').style.display = 'flex';
                    logToDB("OK", "Paso 4: Tekin Verificado");
                } else {
                    handleStepFailure("ERROR SELECCIÓN TEKIN", "Validación Tekin fallida.");
                }
            };
            area.appendChild(b);
        });
    }

    document.getElementById('btn-finish').addEventListener('click', () => {
        step = 1; retryCount = 0; jamaita = ""; kanbanParte = ""; idCliente = ""; pendingData = null;
        document.getElementById('retry-counter').innerText = `Intentos: 0/5`;
        updateUIForStep();
    });

    // 7. MANEJO DE INTENTOS Y BLOQUEO CON RETRASO CONTRA DOBLES LECTURAS
    function handleStepFailure(lockReason, statusText) {
        retryCount++;
        document.getElementById('retry-counter').innerText = `Intentos: ${retryCount}/5`;
        
        if (retryCount >= 5) {
            logToDB("NG", "EXCESO DE INTENTOS: " + lockReason);
            document.getElementById('lock-msg').innerText = lockReason;
            document.getElementById('lock').style.display = 'flex';
            stopCameraOCR();
        } else {
            const pop = document.getElementById('msg-pop');
            pop.innerText = statusText;
            pop.style.display = 'block';
            setTimeout(() => {
                pop.style.display = 'none';
                paused = false;
                if(step === 1 || step === 2) focusHardwareScanner();
            }, 1400); 
        }
    }

    document.getElementById('btn-unlock').addEventListener('click', async () => {
        const p = document.getElementById('pin-tl').value.trim();
        if(!p) return;

        try {
            const q = query(collection(db, "Usuarios"), where("nivel", "==", "Lider"), where("pin", "==", p));
            const s = await getDocs(q);
            if (!s.empty) {
                document.getElementById('lock').style.display = 'none';
                document.getElementById('pin-tl').value = "";
                step = 1; retryCount = 0; jamaita = ""; kanbanParte = ""; idCliente = ""; pendingData = null;
                document.getElementById('retry-counter').innerText = `Intentos: 0/5`;
                updateUIForStep();
            } else {
                document.getElementById('lock-msg').innerText = "PIN INCORRECTO";
            }
        } catch(e) {}
    });

    document.getElementById('btn-login').addEventListener('click', checkLogin);
    initBackgroundResources();
</script>
