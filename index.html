<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#e30613">
    <title>KTMEX Poka-Yoke V5.0 Ultra</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@paddlejs/paddlejs-core@2.0.2/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@paddlejs-models/ocr@2.0.2/dist/index.min.js"></script>

    <style>
        :root { --ktmex-red: #e30613; --dark-bg: #121212; --panel-bg: #1e1e24; --text-light: #f5f5f7; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { margin: 0; background: var(--dark-bg); color: var(--text-light); overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        #camera-container { display: none; width: 100%; height: 40vh; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .panel { flex: 1; background: var(--panel-bg); border-radius: 30px 30px 0 0; padding: 25px; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); overflow-y: auto; transition: transform 0.3s ease; position: relative; z-index: 10; margin-top: auto; }
        .panel.full-height { height: 100vh; border-radius: 0; }
        
        h2, h3 { color: var(--ktmex-red); margin-top: 0; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        
        input { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #333; background: #2a2a35; color: white; font-size: 18px; text-align: center; margin-bottom: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--ktmex-red); box-shadow: 0 0 10px rgba(227, 6, 19, 0.3); }
        
        .btn-main { background: var(--ktmex-red); color: white; border: none; padding: 16px; width: 100%; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; text-transform: uppercase; transition: transform 0.1s, background 0.3s; }
        .btn-main:active { transform: scale(0.97); }
        
        .btn-zebra { background: #007aff; margin-bottom: 15px; }
        .btn-flash { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); border: none; color: white; padding: 12px; border-radius: 50%; font-size: 20px; backdrop-filter: blur(5px); z-index: 100; }

        #res-val { font-size: 28px; font-weight: 900; color: #fff; text-align: center; border: 2px dashed #444; margin: 20px 0; padding: 15px; background: #2a2a35; border-radius: 12px; min-height: 60px; word-break: break-all; transition: 0.3s; }
        #res-val.success { border-color: #27ae60; background: rgba(39, 174, 96, 0.2); color: #27ae60; }
        #res-val.error { border-color: var(--ktmex-red); background: rgba(227, 6, 19, 0.2); color: var(--ktmex-red); }

        .img-verify { width: 100%; height: 200px; object-fit: contain; background: #111; border-radius: 12px; display: none; margin-bottom: 15px; border: 1px solid #444; }
        
        .option-btn { background: #2a2a35; border: 2px solid #444; color: white; padding: 18px; width: 100%; border-radius: 12px; margin-bottom: 12px; font-weight: bold; font-size: 18px; transition: 0.2s; }
        .option-btn:active { background: #444; }

        .lock-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--ktmex-red); z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        
        #step-indicator { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .dot { width: 22%; height: 6px; background: #444; border-radius: 3px; transition: 0.3s; }
        .dot.active { background: var(--ktmex-red); box-shadow: 0 0 8px var(--ktmex-red); }

        #retry-counter { font-size: 14px; color: #888; text-align: center; margin-top: 15px; font-weight: bold; }
        
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="camera-container">
    <button class="btn-flash" onclick="toggleFlash()">🔦</button>
    <video id="webcam" autoplay playsinline webkit-playsinline muted></video>
</div>

<div class="panel full-height" id="main-panel">
    
    <div id="ui-login" class="fade-in">
        <div style="text-align:center; margin-bottom:30px;">
            <h1 style="color:var(--ktmex-red); margin:0; font-size: 36px;">KTMEX</h1>
            <p style="color:#888; margin:5px 0 0 0;">Sistema Poka-Yoke V5</p>
        </div>
        <input type="text" id="nom-input" placeholder="Nómina del Operador" inputmode="numeric">
        <div id="pin-box" style="display:none;"><input type="password" id="pin-input" placeholder="PIN de Seguridad Líder"></div>
        <button class="btn-main" onclick="checkLogin()">INGRESAR AL SISTEMA</button>
    </div>

    <div id="ui-scan" style="display:none;" class="fade-in">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:15px;">
            <h3 id="step-txt" style="margin:0;">PASO 1: JAMAITA</h3>
            <span id="user-display" style="font-size:12px; color:#888; background:#2a2a35; padding:4px 8px; border-radius:8px;"></span>
        </div>
        
        <div id="step-indicator">
            <div class="dot active" id="dot-1"></div>
            <div class="dot" id="dot-2"></div>
            <div class="dot" id="dot-3"></div>
            <div class="dot" id="dot-4"></div>
        </div>

        <div id="res-val">ESPERANDO ESCANEO...</div>

        <button id="btn-trigger-zebra" class="btn-main btn-zebra" onclick="triggerZebraScanner()">🔘 DISPARAR ESCÁNER ZEBRA</button>

        <div id="step4-container" style="display:none;">
            <img id="img-tekin" class="img-verify">
            <div id="options-area" style="display: flex; flex-direction: column;"></div>
        </div>

        <div id="controls-standard">
            <button id="btn-res" class="btn-main" style="display:none; background:#27ae60;" onclick="goNext()">SIGUIENTE PASO ➔</button>
            <div id="retry-counter">Intentos: 0/5</div>
        </div>

        <button id="btn-finish" class="btn-main" style="display:none; background:#27ae60; margin-top:15px;" onclick="resetToStepOne()">✅ VALIDAR Y FINALIZAR</button>
    </div>
</div>

<div id="lock" class="lock-ui">
    <h1 style="font-size:60px; margin:0;">🛑</h1>
    <h2 id="lock-msg">SISTEMA BLOQUEO</h2>
    <p style="margin-bottom: 30px;">Requiere intervención de Líder para continuar.</p>
    <input type="password" id="pin-tl" placeholder="PIN LÍDER" style="background:white; color:black;">
    <button class="btn-main" style="background:#111; color:white;" onclick="unlock()">DESBLOQUEAR SISTEMA</button>
</div>

<script type="module">
    const VALID_CODES = ["M452","M300","M976","M776","M270","M561","M012","M387","M250","M971","M051","M124","M279","M981","M342","M463","M556","M645","M788","M837","M047","M942","M163","M783","M258","M677","M339","M534","M440","M069","M926","M153","M885","M201","M755","M362","M690","M411","M590","M991","M093","M849","M105","M790","M204","M682","M369","M585","M472","M043","M895","M140","M456","M626","M888","M375","M504","M096","M674","M948","M549","M172","M474","M719","M145","M484","M016","M382","M021","M808","M246","M744","M351","M563","M101","M831","M076","M997","M057","M530","M229","M641","M912","M226","M492","M128","M672","M813","M372","M699","M168","M568","M213","M726","M039","M183","M575","M239","M967","M748","M112","M865"];

    const swCode = `
        const CACHE_NAME = 'ktmex-poka-v5';
        self.addEventListener('install', e => { self.skipWaiting(); });
        self.addEventListener('activate', e => { e.waitUntil(clients.claim()); });
        self.addEventListener('fetch', e => {
            if(e.request.method !== 'GET') return;
            e.respondWith(caches.match(e.request).then(res => res || fetch(e.request).then(fRes => {
                return caches.open(CACHE_NAME).then(cache => { cache.put(e.request, fRes.clone()); return fRes; });
            })));
        });
    `;
    const swBlob = new Blob([swCode], {type: 'application/javascript'});
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(console.error);
    }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA6Il03GHS4L_eDY1Kv3fMyF2EwuYLQ5qY",
        authDomain: "logistica-ktmex.firebaseapp.com",
        projectId: "logistica-ktmex",
        storageBucket: "logistica-ktmex.firebasestorage.app",
        messagingSenderId: "166597623735",
        appId: "1:166597623735:web:c0f8d372bc1ee12d81b232"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1GkWY2r-kz_wfv_-LPEeFEdKe1qNILTV86pln2xg_rIM/gviz/tq?tqx=out:csv";

    let user = null, step = 1, jamaita = "", kanbanParte = "", idCliente = "";
    let retryCount = 0, pendingData = null, sheetData = [];
    let track = null, ocrTimer = null, paddleReady = false;

    // --- NUEVA INTEGRACIÓN NATIVA DATAWEDGE INTENT ---
    // Esta es la forma oficial y confiable de conectar Zebra con aplicaciones web
    document.addEventListener("intent", function(event) {
        if (document.getElementById('ui-scan').style.display === 'block' && step < 3) {
            // El intent de DataWedge envía los datos en la propiedad 'data' del evento
            let scannedData = '';
            
            // Verificamos diferentes estructuras posibles del objeto event para mayor compatibilidad
            if (event.data && typeof event.data === 'string') {
                 scannedData = event.data;
            } else if (event.detail && event.detail.data) {
                 scannedData = event.detail.data;
            } else if (event.intent && event.intent.extras && event.intent.extras['com.symbol.datawedge.data_string']) {
                 scannedData = event.intent.extras['com.symbol.datawedge.data_string'];
            }

            if (scannedData) {
                if (navigator.vibrate) navigator.vibrate(100);
                processFound(scannedData);
            }
        }
    });

    // También escuchamos el evento 'com.ktmex.scan' que configuramos en DataWedge
    document.addEventListener("com.ktmex.scan", function(event) {
        if (document.getElementById('ui-scan').style.display === 'block' && step < 3) {
            let scannedData = '';
            
            if (event.detail && event.detail['com.symbol.datawedge.data_string']) {
                scannedData = event.detail['com.symbol.datawedge.data_string'];
            } else if (event.data) {
                scannedData = event.data;
            }

            if (scannedData) {
                if (navigator.vibrate) navigator.vibrate(100);
                processFound(scannedData);
            }
        }
    });
    // ---------------------------------------------------

    async function initAppCore() {
        try {
            const res = await fetch(SHEET_CSV_URL);
            const text = await res.text();
            sheetData = text.split(/\r\n|\n/).map(line => line.split(',').map(c => c.replace(/^"|"$/g, '').trim()));
            
            if(window.paddlejsOCR) {
                await window.paddlejsOCR.init();
                paddleReady = true;
            }
        } catch (e) {}
    }

    window.checkLogin = async () => {
        const nom = document.getElementById('nom-input').value;
        const pin = document.getElementById('pin-input').value;
        if(!nom) return;
        const s = await getDoc(doc(db, "Usuarios", nom));
        if(!s.exists()) return;
        const u = s.data();
        if(u.nivel === "Operador") { start(u); }
        else {
            document.getElementById('pin-box').style.display = 'block';
            if(pin === u.pin) start(u);
        }
    };

    function start(u) {
        user = u;
        document.getElementById('user-display').innerText = u.nombre;
        document.getElementById('ui-login').style.display = 'none';
        document.getElementById('ui-scan').style.display = 'block';
        initAppCore();
    }

    window.triggerZebraScanner = () => {
        // Ejecutamos el intent para activar el láser del escáner desde la pantalla
        window.location.href = "intent://#Intent;action=com.symbol.datawedge.api.ACTION_SOFTSCANTRIGGER;S.com.symbol.datawedge.api.EXTRA_PARAMETER=START_SCANNING;end";
    };

    window.toggleFlash = async () => {
        if (!track) return;
        try {
            const torch = track.getSettings().torch;
            await track.applyConstraints({ advanced: [{ torch: !torch }] });
        } catch(e) {}
    };

    async function processFound(val) {
        const rawVal = val.trim();
        const resEl = document.getElementById('res-val');
        resEl.innerText = rawVal;
        resEl.className = "";

        if (step === 1) {
            jamaita = rawVal;
            if (sheetData.some(row => row[7] === jamaita)) {
                successStep("JAMAITA VALIDADA", "Paso 1: Jamaita OK");
            } else { failStep("SEBANGO NO REGISTRADO"); }
        } 
        else if (step === 2) {
            const parts = rawVal.split('-');
            kanbanParte = parts.length >= 4 ? parts.slice(1, -1).join('-') : (parts.length === 3 ? parts[1] : (rawVal.includes('-') ? rawVal.split('-')[1].trim() : rawVal));
            resEl.innerText = kanbanParte;

            if (sheetData.some(row => row[7] === jamaita && row[9] === kanbanParte)) {
                successStep("KANBAN VALIDADO", "Paso 2: Kanban OK");
            } else { failStep("MEZCLA DE PARTE / KANBAN INCORRECTO"); }
        }
        else if (step === 3) {
            idCliente = rawVal;
            if (sheetData.some(row => row[7] === jamaita && row[9] === kanbanParte && row[8] === idCliente)) {
                getDoc(doc(db, "Maestro_Partes", idCliente)).then(s => pendingData = s.exists() ? s.data() : {});
                stopCamera();
                successStep("ID CLIENTE OK", "Paso 3: ID Cliente OK");
            } else { failStep("ID CLIENTE INCORRECTO"); }
        }
    }

    function successStep(msg, logMsg) {
        const el = document.getElementById('res-val');
        el.innerText = msg;
        el.className = "success";
        document.getElementById('btn-res').style.display = 'block';
        document.getElementById('btn-trigger-zebra').style.display = 'none';
        addDoc(collection(db, "Bitacora_Incidencias"), { usuario: user.nombre, status: "OK", customer_id: jamaita, msg: logMsg, time: serverTimestamp() });
    }

    function failStep(msg) {
        const el = document.getElementById('res-val');
        el.innerText = msg;
        el.className = "error";
        retryCount++;
        document.getElementById('retry-counter').innerText = `Intentos: ${retryCount}/5`;
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        
        if (retryCount >= 5) {
            stopCamera();
            document.getElementById('lock-msg').innerText = msg;
            document.getElementById('lock').style.display = 'flex';
            addDoc(collection(db, "Bitacora_Incidencias"), { usuario: user.nombre, status: "NG", customer_id: jamaita, error: msg, time: serverTimestamp() });
        } else {
            setTimeout(() => { 
                el.innerText = "ESPERANDO ESCANEO..."; 
                el.className = "";
            }, 2000);
        }
    }

    window.goNext = () => {
        if (step === 3) { initStep4(); return; }
        step++;
        updateUIForStep();
    };

    function updateUIForStep() {
        document.getElementById('btn-res').style.display = 'none';
        document.getElementById('res-val').className = "";
        document.getElementById('res-val').innerText = "ESPERANDO ESCANEO...";
        document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i < step));
        
        const txt = document.getElementById('step-txt');
        const trigger = document.getElementById('btn-trigger-zebra');
        const camContainer = document.getElementById('camera-container');
        const panel = document.getElementById('main-panel');

        if (step === 2) {
            txt.innerText = "PASO 2: KANBAN";
            trigger.style.display = 'block';
        } else if (step === 3) {
            txt.innerText = "PASO 3: ID CLIENTE (OCR)";
            trigger.style.display = 'none';
            camContainer.style.display = 'block';
            panel.classList.remove('full-height');
            startCameraOCR();
        }
    }

    function startCameraOCR() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
            const v = document.getElementById('webcam');
            track = stream.getVideoTracks()[0];
            v.srcObject = stream;
            
            ocrTimer = setInterval(async () => {
                if(!paddleReady || v.readyState !== 4) return;
                
                const c = document.createElement('canvas');
                c.width = 640; c.height = 480;
                c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
                
                try {
                    const res = await window.paddlejsOCR.recognize(c);
                    if(res && res.text) {
                        const cleanText = res.text.toUpperCase().replace(/[^A-Z0-9]/g, '');
                        const foundCode = VALID_CODES.find(code => cleanText.includes(code));
                        if (foundCode) {
                            processFound(foundCode);
                        }
                    }
                } catch(e) {}
            }, 1200);
        });
    }

    function stopCamera() {
        if(track) track.stop();
        if(ocrTimer) clearInterval(ocrTimer);
        document.getElementById('camera-container').style.display = 'none';
        document.getElementById('main-panel').classList.add('full-height');
    }

    function initStep4() {
        step = 4;
        document.getElementById('step-txt').innerText = "PASO 4: TEKIN VISUAL";
        document.querySelectorAll('.dot')[3].classList.add('active');
        document.getElementById('controls-standard').style.display = 'none';
        document.getElementById('res-val').style.display = 'none';
        document.getElementById('step4-container').style.display = 'block';
        
        const img = document.getElementById('img-tekin');
        if(pendingData?.img_url) { img.src = pendingData.img_url; img.style.display = 'block'; }
        
        const ok = pendingData?.Tekin_OK || "Validación Correcta";
        const ng = pendingData?.Tekin_NG || "Defecto Encontrado";
        const opts = [ok, ng].sort(() => Math.random() - 0.5);
        
        const area = document.getElementById('options-area');
        area.innerHTML = "";
        opts.forEach(o => {
            const b = document.createElement('button');
            b.className = "option-btn";
            b.innerText = o;
            b.onclick = () => {
                if(o === ok) {
                    area.innerHTML = "<div class='success' style='padding:20px; text-align:center; background:#27ae60; color:white; border-radius:12px; font-weight:bold;'>✅ TEKIN APROBADO</div>";
                    document.getElementById('btn-finish').style.display = 'block';
                } else { failStep("ERROR SELECCIÓN TEKIN"); }
            };
            area.appendChild(b);
        });
    }

    window.resetToStepOne = () => {
        step = 1; jamaita = kanbanParte = idCliente = ""; retryCount = 0;
        document.getElementById('step4-container').style.display = 'none';
        document.getElementById('controls-standard').style.display = 'block';
        document.getElementById('btn-finish').style.display = 'none';
        document.getElementById('res-val').style.display = 'block';
        document.getElementById('res-val').innerText = "ESPERANDO ESCANEO...";
        document.getElementById('step-txt').innerText = "PASO 1: JAMAITA";
        document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === 0));
        document.getElementById('retry-counter').innerText = "Intentos: 0/5";
        document.getElementById('btn-trigger-zebra').style.display = 'block';
    };

    window.unlock = async () => {
        const p = document.getElementById('pin-tl').value;
        const s = await getDocs(query(collection(db, "Usuarios"), where("nivel", "==", "Lider"), where("pin", "==", p)));
        if(!s.empty) {
            document.getElementById('lock').style.display = 'none';
            document.getElementById('pin-tl').value = "";
            resetToStepOne();
        }
    };
</script>
</body>
</html>
